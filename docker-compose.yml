# Optional local Postgres for machines without a native install.
# Stop any native Postgres on 5432 first, or change the host port.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokotech
      POSTGRES_PASSWORD: tokotech
      POSTGRES_DB: tokotech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
